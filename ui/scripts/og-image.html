<!doctype html>
<!-- The share image (scripts/og-image.png, see ui/README.md "Share image"): the demo's /source/machines map pane
     (og-image-map.png, captured at 880x650 CSS px and 2x, default layout, zoom 1, reduced motion, toasts hidden). The crop keeps the Source, its four followers and their
     sync edges in the lower half and uses the pane's own empty dot grid above them for the onboarding line. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
/* Shared by the og-*.html concepts: the app's two faces and its :root tokens (ui/src/index.css), written out
   because these pages load no app CSS. Keep them in step with index.css. */
@font-face {
  font-family: "Manrope";
  src: url("../public/fonts/Manrope.woff2") format("woff2");
  font-weight: 200 800;
}
@font-face {
  font-family: "Ioskeley Mono";
  src: url("../public/fonts/IoskeleyMono-Regular.woff2") format("woff2");
  font-weight: 400;
}
@font-face {
  font-family: "Ioskeley Mono";
  src: url("../public/fonts/IoskeleyMono-Medium.woff2") format("woff2");
  font-weight: 500;
}
@font-face {
  font-family: "Ioskeley Mono";
  src: url("../public/fonts/IoskeleyMono-SemiBold.woff2") format("woff2");
  font-weight: 600;
}
:root {
  --canvas: #080b0c;
  --background: #0b0f10;
  --panel: #0d1213;
  --raised: #121a1b;
  --foreground: #e5eee9;
  --muted-foreground: oklch(0.78 0.026 177.3);
  --faint: oklch(0.64 0.031 179.5);
  --border: color-mix(in oklab, #334646 62%, transparent);
  --border-strong: #334646;
  --ok: oklch(0.74 0.093 144.5);
  --warn: #f1c332;
  --act: #f0975a;
  --bad: oklch(0.72 0.164 22.3);
  --gold: #f1c332;
  --ring: #c4b5fd;
  --dither-color-green: #7aae7a;
  --dither-color-grey: #4d6460;
  --dither-color-purple: #a78bfa;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html,
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: var(--canvas);
  color: var(--foreground);
  font-family: "Manrope", sans-serif;
  -webkit-font-smoothing: antialiased;
}
body {
  position: relative;
}
.mono {
  font-family: "Ioskeley Mono", monospace;
}
/* The lockup used across concepts: the chest at pixel-art scale beside the lowercase wordmark, as in the README. */
.mark {
  display: flex;
  align-items: center;
  gap: 14px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.mark img {
  image-rendering: auto;
}

</style>
    <style>
      /* Crop window: CSS (316,212) of the capture at scale --s; the nodes span x 368..1628, y 518..858. */
      .map {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .map img {
        position: absolute;
        width: calc(1760px * var(--s));
        left: calc(-316px * var(--s));
        top: calc(-212px * var(--s));
      }
      .copy {
        position: absolute;
        left: 64px;
        top: 56px;
        right: 64px;
      }
      .mark {
        font-size: 30px;
        gap: 12px;
      }
      .mark img {
        width: 36px;
        height: 36px;
      }
      h1 {
        margin-top: 28px;
        max-width: 1040px;
        font-size: 42px;
        font-weight: 600;
        line-height: 1.14;
        letter-spacing: -0.025em;
      }
    </style>
  </head>
  <body>
    <div class="map" style="--s: 0.88"><img src="og-image-map.png" alt="" /></div>
    <div class="copy">
      <div class="mark"><img src="../public/favicon.png" alt="" />canonfig</div>
      <h1>Canonfig keeps your AI agent instructions, settings, skills and tools the same on every machine.</h1>
    </div>
  </body>
</html>
