name: Temporary audit reproduction

on:
  pull_request:
    paths:
      - .github/workflows/audit-reproduction.yml

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'fix/installation-audit-diagnostics-and-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture public source and locked test runtime only
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/canonfig-audit-reproduction"
          mkdir -p "$snapshot/source"
          git archive HEAD | tar -x -C "$snapshot/source"
          cp -a node_modules "$snapshot/source/node_modules"
          if test -d website/node_modules; then
            cp -a website/node_modules "$snapshot/source/website/node_modules"
          fi
          runtime="$(dirname "$(dirname "$(command -v node)")")"
          cp -a "$runtime" "$snapshot/runtime"
          git rev-parse HEAD > "$snapshot/source-commit.txt"
          tar -czf "$RUNNER_TEMP/canonfig-audit-reproduction.tar.gz" -C "$snapshot" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonfig-audit-reproduction
          path: ${{ runner.temp }}/canonfig-audit-reproduction.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
