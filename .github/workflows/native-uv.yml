name: Native uv command contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  command-contract:
    name: uv command (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.10.0'
          enable-cache: false
      - run: npm ci
      - run: npm test -- tests/acceptance/uv-command-contract.test.ts
        env:
          CANONFIG_REQUIRE_UV_TESTS: '1'
