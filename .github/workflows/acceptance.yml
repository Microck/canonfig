name: Cross-platform acceptance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            native_test: tests/machine-state-linux.test.ts
          - platform: macos
            os: macos-latest
            native_test: tests/machine-state-macos.test.ts
          - platform: windows
            os: windows-latest
            native_test: tests/machine-state-windows.test.ts
          # GitHub's Arm64 Windows hosted runner (public repositories).
          # The acceptance scenario derives its platform from the host, so
          # the arm64 leg reports itself as plain windows.
          - platform: windows-arm64
            os: windows-11-arm
            acceptance_platform: windows
            native_test: tests/machine-state-windows.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The E2E test packs the CLI itself and its prepack builds dist and
      # build-receipt.json in the checkout, so the workflow builds exactly once.
      - name: Run packed CLI E2E
        run: npx vitest run tests/packed-cli.test.ts

      # Pack the dist the E2E test just exercised, without rebuilding, so the
      # preserved tarball is byte-for-byte the tested package.
      - name: Package tested npm artifact
        run: npm pack --ignore-scripts

      - name: Run native platform contract
        run: npx vitest run ${{ matrix.native_test }}

      - name: Run native secret-store contract
        run: npx vitest run tests/integration/secret-cleanup-retry.test.ts

      - name: Run acceptance scenario
        run: npm run test:acceptance
        env:
          CANONFIG_ACCEPTANCE_PLATFORM: ${{ matrix.acceptance_platform || matrix.platform }}

      - name: Preserve tested package and build identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonfig-tested-package-${{ matrix.platform }}-${{ github.sha }}
          path: |
            microck-canonfig-*.tgz
            build-receipt.json
          if-no-files-found: warn
          retention-days: 7

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Snapshot tracked validation inputs
        run: |
          mkdir -p canonfig-validation
          git archive --format=tar --output=canonfig-validation/source.tar HEAD
          git rev-parse HEAD > canonfig-validation/commit.txt
          sha256sum canonfig-validation/source.tar > canonfig-validation/source.sha256

      - name: Preserve exact validation inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonfig-validation-inputs-${{ github.sha }}
          path: canonfig-validation/
          if-no-files-found: error
          retention-days: 7

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate release artifact
        run: npm run release:validate

      - name: Build
        run: npm run build
