name: Cross-platform acceptance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            native_test: tests/machine-state-linux.test.ts
          - platform: macos
            os: macos-latest
            native_test: tests/machine-state-macos.test.ts
          - platform: windows
            os: windows-latest
            native_test: tests/machine-state-windows.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Package npm artifact
        run: npm pack --ignore-scripts

      - name: Run packed CLI E2E
        run: npx vitest run tests/packed-cli.test.ts

      # TEMPORARY measurement for the windows flake investigation on this PR.
      # It separates plain Windows PowerShell startup from the csc.exe compile
      # that Add-Type performs, so the permission-restore timeout can be sized
      # from data. Delete this step before the PR is reviewed.
      - name: Measure Windows PowerShell startup and Add-Type compile
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          function Measure-Run($label, $script) {
            $samples = @()
            for ($i = 0; $i -lt 6; $i++) {
              $sw = [Diagnostics.Stopwatch]::StartNew()
              & $ps -NoLogo -NoProfile -NonInteractive -Command $script | Out-Null
              $sw.Stop()
              $samples += $sw.Elapsed.TotalMilliseconds
            }
            $sorted = $samples | Sort-Object
            "{0}: min={1:N0}ms max={2:N0}ms samples={3}" -f $label, $sorted[0], $sorted[-1], (($samples | ForEach-Object { "{0:N0}" -f $_ }) -join ",")
          }
          Measure-Run "startup only" "exit 0"
          Measure-Run "GetAccessControl (snapshotPermissions shape)" "[IO.File]::GetAccessControl('$env:SystemRoot\\notepad.exe',[Security.AccessControl.AccessControlSections]'Access,Owner,Group').GetSecurityDescriptorSddlForm([Security.AccessControl.AccessControlSections]'Access,Owner,Group') | Out-Null"
          Measure-Run "Add-Type compile (restoreNativePermissions shape)" "Add-Type -TypeDefinition 'public static class CanonfigProbe { public static int Value() { return 1; } }'; [CanonfigProbe]::Value() | Out-Null"

      - name: Run native platform contract
        run: npx vitest run ${{ matrix.native_test }}

      - name: Run native secret-store contract
        run: npx vitest run tests/integration/secret-cleanup-retry.test.ts

      - name: Run acceptance scenario
        run: npm run test:acceptance
        env:
          CANONFIG_ACCEPTANCE_PLATFORM: ${{ matrix.platform }}

      - name: Preserve tested package and build identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonfig-tested-package-${{ matrix.platform }}-${{ github.sha }}
          path: |
            microck-canonfig-*.tgz
            build-receipt.json
          if-no-files-found: warn
          retention-days: 7

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Snapshot tracked validation inputs
        run: |
          mkdir -p canonfig-validation
          git archive --format=tar --output=canonfig-validation/source.tar HEAD
          git rev-parse HEAD > canonfig-validation/commit.txt
          sha256sum canonfig-validation/source.tar > canonfig-validation/source.sha256

      - name: Preserve exact validation inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonfig-validation-inputs-${{ github.sha }}
          path: canonfig-validation/
          if-no-files-found: error
          retention-days: 7

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate release artifact
        run: npm run release:validate

      - name: Build
        run: npm run build
