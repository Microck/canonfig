name: Cross-platform acceptance

on:
  workflow_dispatch:
    inputs:
      windows_arm64_only:
        description: Run Windows ARM64 acceptance only
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 2"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR revisions can stop; every main push keeps its own validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: Acceptance (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-latest' || matrix.platform == 'windows-arm64' && 'windows-11-arm' || format('{0}-latest', matrix.platform) }}
    timeout-minutes: ${{ matrix.platform == 'windows-arm64' && 45 || 360 }}
    strategy:
      fail-fast: false
      matrix:
        # ARM64 took 33 minutes on the hosted runner. Run it weekly and on
        # demand so it exercises the same scenarios outside the PR queue.
        platform: ${{ fromJSON((github.event_name == 'schedule' || inputs.windows_arm64_only) && '["windows-arm64"]' || '["linux","macos","windows"]') }}
    env:
      CANONFIG_ACCEPTANCE_PLATFORM: ${{ matrix.platform == 'windows-arm64' && 'windows' || matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          architecture: ${{ matrix.platform == 'windows-arm64' && 'arm64' || '' }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Require native ARM64 Node
        if: matrix.platform == 'windows-arm64'
        run: node -e "if (process.arch !== 'arm64') throw new Error('Windows ARM64 acceptance requires native ARM64 Node')"

      # CLI contracts do not use the website workspace; repository validation installs it.
      - name: Install locked dependencies
        run: |
          npm ci --workspaces=false
          npm ci --prefix ui

      # The E2E test packs the CLI itself and its prepack builds dist and
      # build-receipt.json in the checkout, so the workflow builds exactly once.
      - name: Run packed CLI E2E
        run: npx vitest run tests/packed-cli.test.ts

      # Pack the dist the E2E test just exercised, without rebuilding, so the
      # preserved tarball is byte-for-byte the tested package.
      - name: Package tested npm artifact
        run: npm pack --ignore-scripts

      - name: Run native platform contract
        run: npx vitest run tests/machine-state-${{ env.CANONFIG_ACCEPTANCE_PLATFORM }}.test.ts tests/projection-import-safety.test.ts tests/acceptance/scheduler-runtime-readiness.test.ts

      - name: Run native secret-store contract
        run: npx vitest run tests/integration/secret-cleanup-retry.test.ts

      - name: Run acceptance scenario
        run: npm run test:acceptance

      # One real scheduled fire per platform: the installed native job is
      # triggered through the scheduler's own run-now mechanism and must
      # record its fire in the follower state directory.
      - name: Fire the installed native job
        run: node scripts/schedule-fire-acceptance.mjs

      - name: Preserve tested package and build identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonfig-tested-package-${{ matrix.platform }}-${{ github.sha }}
          path: |
            microck-canonfig-*.tgz
            build-receipt.json
          if-no-files-found: warn
          retention-days: 7

  repository-validation:
    name: Repository validation
    if: github.event_name != 'schedule' && !inputs.windows_arm64_only
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Snapshot tracked validation inputs
        run: |
          mkdir -p canonfig-validation
          git archive --format=tar --output=canonfig-validation/source.tar HEAD
          git rev-parse HEAD > canonfig-validation/commit.txt
          sha256sum canonfig-validation/source.tar > canonfig-validation/source.sha256

      - name: Preserve exact validation inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonfig-validation-inputs-${{ github.sha }}
          path: canonfig-validation/
          if-no-files-found: error
          retention-days: 7

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint GUI and demo
        run: npm run ui:lint

      - name: Build browser assets for integration tests
        run: npm run build:cli

      - name: Test
        run: npm test

      - name: Validate release artifact
        run: npm run release:validate

      - name: Build
        run: npm run build
