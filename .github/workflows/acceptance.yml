name: Cross-platform acceptance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-process-input-refactor:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/secure-secret-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/secure-secret-sync
          fetch-depth: 0

      - name: Apply process-input refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          linux = Path("src/machine/linux.layer.ts")
          source = linux.read_text()
          if "const maximumProcessInputBytes = 64 * 1024;" not in source:
              source = source.replace(
                  "const defaultFileMode = 0o600;\n",
                  "const defaultFileMode = 0o600;\nconst maximumProcessInputBytes = 64 * 1024;\n",
                  1,
              )
          validation_anchor = '''    return yield* Effect.tryPromise({
              try: (signal) => new Promise<ProcessResult>((resolveProcess, rejectProcess) => {'''
          if "standard input exceeds ${maximumProcessInputBytes} bytes" not in source:
              replacement = '''    if (
                invocation.standardInput !== undefined
                && invocation.standardInput.byteLength > maximumProcessInputBytes
              ) {
                return yield* new ProcessStartError({
                  executable,
                  message: `standard input exceeds ${maximumProcessInputBytes} bytes`,
                });
              }
              return yield* Effect.tryPromise({
                try: (signal) => new Promise<ProcessResult>((resolveProcess, rejectProcess) => {'''
              if validation_anchor not in source:
                  raise SystemExit("process validation anchor not found")
              source = source.replace(validation_anchor, replacement, 1)
          source = source.replace(
              '          stdio: ["ignore", "pipe", "pipe"],',
              '''          stdio: [
                    invocation.standardInput === undefined ? "ignore" : "pipe",
                    "pipe",
                    "pipe",
                  ],''',
              1,
          )
          stdin_anchor = '''        child.once("error", (cause) => {
                  failure = new ProcessStartSignal(messageOf(cause));
                });
                const timer = setTimeout('''
          if "child.stdin.end(invocation.standardInput);" not in source:
              stdin_replacement = '''        child.once("error", (cause) => {
                  failure = new ProcessStartSignal(messageOf(cause));
                });
                if (invocation.standardInput !== undefined && child.stdin !== null) {
                  child.stdin.once("error", (cause) => {
                    terminate(new ProcessStartSignal(messageOf(cause)));
                  });
                  child.stdin.end(invocation.standardInput);
                }
                const timer = setTimeout('''
              if stdin_anchor not in source:
                  raise SystemExit("process stdin anchor not found")
              source = source.replace(stdin_anchor, stdin_replacement, 1)
          linux.write_text(source)

          native = Path("src/secrets/native-secret-store.ts")
          native.write_text(r'''import { createHash } from "node:crypto";
          import { win32 } from "node:path";

          import { Effect, Layer, Redacted, Schema } from "effect";

          import { CredentialReference } from "../domain/brand.ts";
          import {
            CredentialStorageError,
            HumanActionRequiredError,
            type MachineStateError,
          } from "../machine/machine-state.errors.ts";
          import { MachineState } from "../machine/machine-state.service.ts";
          import type {
            CredentialStorageCapability,
            ProcessEnvironmentEntry,
            StoreCredentialInput,
          } from "../machine/machine-state.types.ts";

          const maximumCredentialOutputBytes = 1024 * 1024;
          const credentialTimeoutMilliseconds = 5_000;
          const decode = Schema.decodeUnknownSync;

          export interface NativeCredentialWriteCommand {
            readonly provider: "keychain" | "credential-manager";
            readonly executable: string;
            readonly arguments: ReadonlyArray<string>;
            readonly environment: ReadonlyArray<ProcessEnvironmentEntry>;
            readonly standardInput: Uint8Array;
            readonly reference: typeof CredentialReference.Type;
          }

          export interface NativeSecretStoreLayerOptions {
            readonly environment?: NodeJS.ProcessEnv | undefined;
            readonly runCommand?: ((
              machine: MachineState["Service"],
              command: NativeCredentialWriteCommand,
            ) => Effect.Effect<number | null, MachineStateError>) | undefined;
          }

          const failure = (
            provider: NativeCredentialWriteCommand["provider"],
          ): HumanActionRequiredError =>
            provider === "keychain"
              ? new HumanActionRequiredError({
                action: "unlock macOS Keychain",
                recovery: "Unlock the login Keychain for this user session, then retry.",
              })
              : new HumanActionRequiredError({
                action: "unlock Windows Credential Manager",
                recovery: "Sign in interactively and make Credential Manager available, then retry.",
              });

          const runNativeCredentialCommand = (
            machine: MachineState["Service"],
            command: NativeCredentialWriteCommand,
          ): Effect.Effect<number | null, MachineStateError> =>
            Effect.gen(function*() {
              const executable = yield* machine.normalizePath({
                path: command.executable,
              });
              const result = yield* machine.runProcess({
                executable,
                arguments: command.arguments,
                environment: command.environment,
                standardInput: command.standardInput,
                timeoutMilliseconds: credentialTimeoutMilliseconds,
                maximumOutputBytes: maximumCredentialOutputBytes,
              });
              return result.exitCode;
            });

          export const nativeCredentialWriteCommand = (
            capability: Extract<CredentialStorageCapability, {
              readonly kind: "secure-noninteractive";
            }>,
            input: StoreCredentialInput,
            environment: NodeJS.ProcessEnv = process.env,
          ): NativeCredentialWriteCommand | undefined => {
            if (capability.provider === "secret-service") return undefined;
            const key = createHash("sha256").update(input.name).digest("hex");
            const value = Redacted.value(input.value);

            if (capability.provider === "keychain") {
              const hexadecimalValue = Buffer.from(value, "utf8").toString("hex");
              return {
                provider: "keychain",
                executable: "/usr/bin/security",
                arguments: [],
                environment: [],
                standardInput: new TextEncoder().encode(
                  `add-generic-password -U -a canonfig -s dev.canonfig.${key} -X ${hexadecimalValue}\n`,
                ),
                reference: decode(CredentialReference)(`keychain:${key}`),
              };
            }

            const powershell = environment.CANONFIG_POWERSHELL
              ?? win32.join(
                environment.SystemRoot ?? "C:\\Windows",
                "System32",
                "WindowsPowerShell",
                "v1.0",
                "powershell.exe",
              );
            const script = [
              "$ErrorActionPreference='Stop'",
              "[Console]::InputEncoding=[System.Text.UTF8Encoding]::new($false)",
              "$secret=[Console]::In.ReadToEnd()",
              "$vault=New-Object Windows.Security.Credentials.PasswordVault",
              "$credential=New-Object Windows.Security.Credentials.PasswordCredential("
                + "$env:CANONFIG_TARGET,'canonfig',$secret)",
              "$vault.Add($credential)",
            ].join(";");
            return {
              provider: "credential-manager",
              executable: powershell,
              arguments: [
                "-NoLogo",
                "-NoProfile",
                "-NonInteractive",
                "-Command",
                script,
              ],
              environment: [{
                name: "CANONFIG_TARGET",
                value: `dev.canonfig.${key}`,
              }],
              standardInput: new TextEncoder().encode(value),
              reference: decode(CredentialReference)(`credential-manager:${key}`),
            };
          };

          export const nativeSecretStoreLayer = (
            base: Layer.Layer<MachineState>,
            options: NativeSecretStoreLayerOptions = {},
          ): Layer.Layer<MachineState> =>
            Layer.effect(
              MachineState,
              Effect.map(MachineState, (machine) => ({
                ...machine,
                storeCredential: (input: StoreCredentialInput) =>
                  Effect.gen(function*() {
                    if (input.name.trim().length === 0) {
                      return yield* new CredentialStorageError({
                        operation: "store credential",
                        reference: "native-store",
                        message: "credential name must not be empty",
                      });
                    }
                    const capability = yield* machine.credentialCapability();
                    if (capability.kind !== "secure-noninteractive") {
                      return yield* machine.storeCredential(input);
                    }
                    const command = nativeCredentialWriteCommand(
                      capability,
                      input,
                      options.environment,
                    );
                    if (command === undefined) return yield* machine.storeCredential(input);
                    const exitCode = yield* (options.runCommand ?? runNativeCredentialCommand)(
                      machine,
                      command,
                    );
                    if (exitCode !== 0) return yield* failure(command.provider);
                    return command.reference;
                  }),
              })),
            ).pipe(Layer.provide(base));
          ''')

          test = Path("tests/integration/secret-cleanup-retry.test.ts")
          source = test.read_text()
          source = source.replace(
              'import { join } from "node:path";',
              'import { join, win32 } from "node:path";',
              1,
          )
          source = source.replace(
              'import { linuxMachineStateLayer } from "../../src/machine/linux.layer.ts";\n',
              'import { linuxMachineStateLayer } from "../../src/machine/linux.layer.ts";\nimport { windowsMachineStateLayer } from "../../src/machine/windows.layer.ts";\n',
              1,
          )
          before_macos = '  it("keeps macOS secret values out of arguments and environment", () => {'
          if "passes bounded standard input through the machine process boundary" not in source:
              process_tests = r'''  it("passes bounded standard input through the machine process boundary", async () => {
            const root = mkdtempSync(join(tmpdir(), "canonfig-process-input-"));
            const layer = linuxMachineStateLayer({
              environment: [
                { name: "HOME", value: join(root, "home") },
                { name: "PATH", value: process.env.PATH ?? "" },
              ],
              credentialPolicy: {
                kind: "local-file",
                path: join(root, "credentials"),
              },
            });
            const input = "bounded-standard-input";

            try {
              const result = await Effect.runPromise(
                Effect.gen(function*() {
                  const machine = yield* MachineState;
                  const executable = yield* machine.normalizePath({
                    path: process.execPath,
                  });
                  return yield* machine.runProcess({
                    executable,
                    arguments: ["-e", "process.stdin.pipe(process.stdout)"],
                    standardInput: new TextEncoder().encode(input),
                    timeoutMilliseconds: 5_000,
                    maximumOutputBytes: 4_096,
                  });
                }).pipe(Effect.provide(layer)),
              );

              expect(result.exitCode).toBe(0);
              expect(Buffer.from(result.standardOutput).toString("utf8")).toBe(input);
            } finally {
              rmSync(root, { recursive: true, force: true });
            }
          });

          it("rejects oversized standard input before starting a process", async () => {
            const root = mkdtempSync(join(tmpdir(), "canonfig-process-limit-"));
            const layer = linuxMachineStateLayer({
              environment: [
                { name: "HOME", value: join(root, "home") },
                { name: "PATH", value: process.env.PATH ?? "" },
              ],
              credentialPolicy: {
                kind: "local-file",
                path: join(root, "credentials"),
              },
            });

            try {
              await expect(
                Effect.runPromise(
                  Effect.gen(function*() {
                    const machine = yield* MachineState;
                    const executable = yield* machine.normalizePath({
                      path: process.execPath,
                    });
                    return yield* machine.runProcess({
                      executable,
                      arguments: ["-e", "process.exit(0)"],
                      standardInput: new Uint8Array(64 * 1024 + 1),
                      timeoutMilliseconds: 5_000,
                      maximumOutputBytes: 4_096,
                    });
                  }).pipe(Effect.provide(layer)),
                ),
              ).rejects.toMatchObject({ _tag: "ProcessStartError" });
            } finally {
              rmSync(root, { recursive: true, force: true });
            }
          });

          '''
              if before_macos not in source:
                  raise SystemExit("macOS test anchor not found")
              source = source.replace(before_macos, process_tests + before_macos, 1)
          if "decodes multibyte Windows standard input as UTF-8" not in source:
              execution = r'''

          it.runIf(process.platform === "win32")(
            "decodes multibyte Windows standard input as UTF-8",
            async () => {
              const secret = "é🔐-windows-round-trip";
              const layer = windowsMachineStateLayer();
              const powershell = win32.join(
                process.env.SystemRoot ?? "C:\\Windows",
                "System32",
                "WindowsPowerShell",
                "v1.0",
                "powershell.exe",
              );
              const script = [
                "$ErrorActionPreference='Stop'",
                "[Console]::InputEncoding=[System.Text.UTF8Encoding]::new($false)",
                "[Console]::OutputEncoding=[System.Text.UTF8Encoding]::new($false)",
                "$value=[Console]::In.ReadToEnd()",
                "[Console]::Out.Write($value)",
              ].join(";");

              const result = await Effect.runPromise(
                Effect.gen(function*() {
                  const machine = yield* MachineState;
                  const executable = yield* machine.normalizePath({ path: powershell });
                  return yield* machine.runProcess({
                    executable,
                    arguments: [
                      "-NoLogo",
                      "-NoProfile",
                      "-NonInteractive",
                      "-Command",
                      script,
                    ],
                    standardInput: new TextEncoder().encode(secret),
                    timeoutMilliseconds: 5_000,
                    maximumOutputBytes: 4_096,
                  });
                }).pipe(Effect.provide(layer)),
              );

              expect(result.exitCode).toBe(0);
              expect(Buffer.from(result.standardOutput).toString("utf8")).toBe(secret);
              expect(Buffer.from(result.standardError).toString("utf8")).toBe("");
            },
          );
          '''
              final = source.rfind("\n});")
              if final < 0:
                  raise SystemExit("test suite terminator not found")
              source = source[:final] + execution + source[final:]
          test.write_text(source)
          PY

          git config user.name "Microck"
          git config user.email "contact@micr.dev"
          git add src/machine/linux.layer.ts src/secrets/native-secret-store.ts tests/integration/secret-cleanup-retry.test.ts
          if git diff --cached --quiet; then
            echo "Process-input refactor already applied."
          else
            git commit -m "refactor: use bounded machine stdin for native secrets"
            git push origin HEAD:feat/secure-secret-sync
          fi

  acceptance:
    name: Acceptance (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            native_test: tests/machine-state-linux.test.ts
          - platform: macos
            os: macos-latest
            native_test: tests/machine-state-macos.test.ts
          - platform: windows
            os: windows-latest
            native_test: tests/machine-state-windows.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Package npm artifact
        run: npm pack --ignore-scripts

      - name: Run packed CLI E2E
        run: npx vitest run tests/packed-cli.test.ts

      - name: Run native platform contract
        run: npx vitest run ${{ matrix.native_test }}

      - name: Run acceptance scenario
        run: npm run test:acceptance
        env:
          CANONFIG_ACCEPTANCE_PLATFORM: ${{ matrix.platform }}

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate release artifact
        run: npm run release:validate

      - name: Build
        run: npm run build
