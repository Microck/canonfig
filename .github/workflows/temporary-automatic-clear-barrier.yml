name: Temporary automatic clear barrier fix

on:
  push:
    branches:
      - feat/command-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/command-logging
          fetch-depth: 0

      - name: Default automatic-clear fixture controls
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("tests/packed-cli.test.ts")
          source = path.read_text()
          old = '''  ...process.env,
            ...packedSchedulerEnvironment,
            ...environment,'''
          new = '''  ...process.env,
            ...packedSchedulerEnvironment,
            CANONFIG_TEST_SECRET_CLEAR_DELAY_SECONDS: "",
            CANONFIG_TEST_SECRET_CLEAR_FAIL: "0",
            ...environment,'''
          if old not in source:
              raise SystemExit("packed environment merge point not found")
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "Microck"
          git config user.email "contact@micr.dev"
          git add tests/packed-cli.test.ts
          git commit -m "test: default automatic-clear fixture controls"
          git push origin HEAD:feat/command-logging
