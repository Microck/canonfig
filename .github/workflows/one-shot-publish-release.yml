name: One-shot publish release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-publish-release.yml

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: publish runbook release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify tagged release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          release_commit="$(git rev-parse HEAD^)"
          subject="$(git show -s --format=%s "$release_commit")"
          test "$subject" = "release: $tag"
          git fetch origin --tags --force
          tag_commit="$(git rev-parse "$tag^{}")"
          test "$tag_commit" = "$release_commit"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check out tagged commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$TAG"

      - name: Install locked dependencies
        run: npm ci

      - name: Build release artifact
        run: npm run build:cli

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$(npm view "@microck/canonfig@$VERSION" version 2>/dev/null || true)" != "$VERSION"; then
            npm publish --access public --provenance
          fi
          test "$(npm view "@microck/canonfig@$VERSION" version)" = "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Canonfig $VERSION" \
              --notes-file "docs/releases/$TAG.md" \
              --verify-tag
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
