name: Fix release documentation

on:
  push:
    branches:
      - release/v2.2.0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/v2.2.0
          fetch-depth: 0

      - name: Repair the validated example
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/architecture.md")
          text = path.read_text(encoding="utf-8")
          old = "canonfig source scan\n"
          new = "canonfig source scan --file AGENTS.md\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one architecture scan example, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/fix-release-docs.yml
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(release): make architecture scan example executable"
          git push origin HEAD:release/v2.2.0
