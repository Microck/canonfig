name: Publish reviewed installer-binding wiring
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Microck/canonfig' && github.event.pull_request.head.repo.full_name == 'Microck/canonfig' && github.head_ref == 'fix/audit-local-installer-bindings' && github.base_ref == 'fix/audit-private-enrollment-stdin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact reviewed wiring and remove this one-shot publisher
        run: node tools/publish-installer-binding.mjs
      - name: Commit only reviewed files to this PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/main.ts src/synchronization/resource-executors.ts tools/publish-installer-binding.mjs .github/workflows/publish-installer-binding.yml
          git commit -m 'Wire reviewed installer bindings into the CLI and deterministic executor'
          git push origin HEAD:refs/heads/fix/audit-local-installer-bindings
