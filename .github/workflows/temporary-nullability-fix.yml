name: Temporary process stream nullability fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/secure-secret-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/secure-secret-sync
          fetch-depth: 0

      - name: Apply nullability guard
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("src/machine/linux.layer.ts")
          source = path.read_text()
          old = '''        child.stdout.on("data", capture(output));
          child.stderr.on("data", capture(errors));
          '''
          new = '''        if (child.stdout === null || child.stderr === null) {
            terminate(new ProcessStartSignal("process output streams are unavailable"));
          } else {
            child.stdout.on("data", capture(output));
            child.stderr.on("data", capture(errors));
          }
          '''
          if old not in source:
              raise SystemExit("stream listener anchor not found")
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name "Microck"
          git config user.email "contact@micr.dev"
          git add src/machine/linux.layer.ts
          git commit -m "fix: guard bounded process output streams"
          git push origin HEAD:feat/secure-secret-sync
