name: Prepare v2.2.0

on:
  push:
    branches:
      - release/v2.2.0

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/v2.2.0
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Prepare version and documentation
        run: node tools/release/prepare-v2.2.0.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release tree
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run release:validate
          npm run build
          git diff --check

      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): prepare v2.2.0"
          git push origin HEAD:release/v2.2.0
