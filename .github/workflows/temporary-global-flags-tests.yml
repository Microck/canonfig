name: Temporary global flag route tests

on:
  push:
    branches:
      - feat/command-logging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/command-logging
          fetch-depth: 0

      - name: Add packed global flag coverage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("tests/packed-cli.test.ts")
          source = path.read_text()
          if "const globalSpecialVersion = invoke(" in source:
              raise SystemExit("global flag route coverage already present")
          label = '      command: "secrets.list",'
          label_index = source.index(label)
          assertion_end = source.index("\n    });", label_index) + len("\n    });")
          block = "\n" + "\n".join([
              "",
              "    const globalSpecialVersion = invoke(",
              "      followerHome,",
              '      ["secrets", "--version"],',
              "    );",
              "    expect(globalSpecialVersion).toEqual({",
              "      status: 0,",
              '      stdout: "2.1.1\\n",',
              '      stderr: "",',
              "    });",
              "",
              "    const leadingGlobalVersion = invoke(",
              "      followerHome,",
              '      ["--json", "harness", "--version"],',
              "    );",
              "    expect(leadingGlobalVersion).toEqual({",
              "      status: 0,",
              '      stdout: "2.1.1\\n",',
              '      stderr: "",',
              "    });",
              "",
              "    const globalSpecialHelp = invoke(",
              "      followerHome,",
              '      ["harness", "--help"],',
              "    );",
              '    expect(globalSpecialHelp).toMatchObject({ status: 0, stderr: "" });',
              '    expect(globalSpecialHelp.stdout).toContain("Usage: canonfig");',
              "",
              "    const leadingGlobalHelp = invoke(",
              "      followerHome,",
              '      ["--json", "secrets", "--help"],',
              "    );",
              '    expect(leadingGlobalHelp).toMatchObject({ status: 0, stderr: "" });',
              '    expect(leadingGlobalHelp.stdout).toContain("Usage: canonfig");',
          ])
          path.write_text(source[:assertion_end] + block + source[assertion_end:])
          PY
          git config user.name "Microck"
          git config user.email "contact@micr.dev"
          git add tests/packed-cli.test.ts
          git commit -m "test: cover global flags on special routes"
          git push origin HEAD:feat/command-logging
