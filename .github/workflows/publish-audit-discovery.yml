name: Publish reviewed discovery patch
on:
  push:
    branches: [fix/audit-discovery-scope]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Microck/canonfig' && github.ref == 'refs/heads/fix/audit-discovery-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish only the reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          echo '73d38c89bc8746788214255e078615fc10e2b03a8f481441151f5c1e5e729bd7  .github/audit-discovery.patch' | sha256sum --check
          git apply --check .github/audit-discovery.patch
          git apply --index .github/audit-discovery.patch
          git rm .github/audit-discovery.patch .github/workflows/publish-audit-discovery.yml
          test "$(git write-tree)" = f54b5bb36340ac961f5a831b2c1ec38b744d3e04
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(discovery): exclude disabled records and preserve MCP executable identity'
          git push origin HEAD:refs/heads/fix/audit-discovery-scope
