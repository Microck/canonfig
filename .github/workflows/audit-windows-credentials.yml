name: Publish reviewed Windows credential fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/audit-windows-credentials.yml
      - .github/audit-windows-credentials.patch

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == 'Microck/canonfig' && github.head_ref == 'fix/audit-windows-credentials'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply only the reviewed patch and remove temporary publication files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, hashlib
          path = pathlib.Path('.github/audit-windows-credentials.patch')
          content = path.read_bytes()
          assert hashlib.sha256(content).hexdigest() == '41a9d9fbf75f8b390317cfe96ac3f9d067230d9605e1b29d69c5f3f3e011ddba'
          content = content.replace(b'-  ].join(";"),\n+  const script = windowsCredentialScript("store");', b'-  ].join(";");\n+  const script = windowsCredentialScript("store");')
          assert hashlib.sha256(content).hexdigest() == '98fb5bcc3bf9be56d2f71b201ad70c569ed158597dbb05b5b33c6198cc5cb4d7'
          path.write_bytes(content)
          PY
          git apply --index --whitespace=error-all .github/audit-windows-credentials.patch
          git rm -f .github/audit-windows-credentials.patch .github/workflows/audit-windows-credentials.yml
          test "$(git write-tree)" = '4b815f9f7a6cc73ecc38f4cd25138d9bbc09e206'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(windows): activate native vault and preserve UTF-8 credential values'
          git push origin HEAD:refs/heads/fix/audit-windows-credentials
