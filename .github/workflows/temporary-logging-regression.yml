name: Temporary logging regression patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/command-logging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/command-logging
          fetch-depth: 0

      - name: Add packed runtime regression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("tests/packed-cli.test.ts")
          source = path.read_text()
          anchor = '''    const firstApply = requireSuccess(
              invoke(workstationHome, ["sync", "--apply", "--json"]),
              "apply workstation revision one",
            );'''
          insertion = '''    const automaticSecretLog = resolve(
              workstationHome,
              "automatic-secret-failure.log",
            );
            const invalidSecretManifest = resolve(
              workstationHome,
              ".canonfig",
              "secrets.json",
            );
            writeFileSync(invalidSecretManifest, '{"invalid":true}\\n');
            const automaticSecretFailure = invoke(
              workstationHome,
              ["sync", "--apply", "--json"],
              { CANONFIG_LOG_FILE: automaticSecretLog },
            );
            expect(automaticSecretFailure.status).not.toBe(0);
            const automaticSecretEntries = readFileSync(
              automaticSecretLog,
              "utf8",
            ).trim().split("\\n").map((line) => JSON.parse(line) as {
              readonly event: string;
              readonly exitCode?: number;
              readonly durationMilliseconds?: number;
            });
            expect(automaticSecretEntries).toHaveLength(2);
            expect(automaticSecretEntries[1]).toMatchObject({
              event: "command.completed",
              exitCode: automaticSecretFailure.status,
            });
            expect(automaticSecretEntries[1]!.durationMilliseconds)
              .toBeGreaterThan(0);
            rmSync(invalidSecretManifest, { force: true });

            const firstApply = requireSuccess(
              invoke(workstationHome, ["sync", "--apply", "--json"]),
              "apply workstation revision one",
            );'''
          if anchor not in source:
              raise SystemExit("first apply anchor not found")
          path.write_text(source.replace(anchor, insertion, 1))
          PY
          git config user.name "Microck"
          git config user.email "contact@micr.dev"
          git add tests/packed-cli.test.ts
          git commit -m "test: log final automatic secret-sync failure"
          git push origin HEAD:feat/command-logging
