name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - package.json
      - RELEASE_NOTES.md
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: canonfig-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(release): prepare v'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const requested = process.env.REQUESTED_VERSION?.trim();
          const version = requested === undefined || requested.length === 0
            ? manifest.version
            : requested;
          if (version !== manifest.version) {
            throw new Error(`requested ${version}; package.json contains ${manifest.version}`);
          }
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`release version must be exact semver: ${version}`);
          }
          const notes = readFileSync("RELEASE_NOTES.md", "utf8");
          if (!notes.includes(`v${version}`)) {
            throw new Error(`RELEASE_NOTES.md does not describe v${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Verify unpublished version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

          response="$(mktemp)"
          if ! registry_status="$(
            curl --silent --show-error --location \
              --output "${response}" \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/@microck%2fcanonfig/${RELEASE_VERSION}"
          )"; then
            echo "npm registry preflight failed" >&2
            exit 1
          fi

          case "${registry_status}" in
            404)
              ;;
            200)
              echo "@microck/canonfig@${RELEASE_VERSION} is already published" >&2
              exit 1
              ;;
            *)
              echo "npm registry preflight returned HTTP ${registry_status}" >&2
              cat "${response}" >&2
              exit 1
              ;;
          esac

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run release:validate
          npm run build
          git diff --check

      - name: Publish package through npm trusted publishing
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Canonfig v${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --fail-on-no-commits

      - name: Verify published package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            published="$(npm view "@microck/canonfig@${RELEASE_VERSION}" version 2>/dev/null || true)"
            if [ "${published}" = "${RELEASE_VERSION}" ]; then
              break
            fi
            if [ "${attempt}" = 5 ]; then
              echo "published package did not become visible" >&2
              exit 1
            fi
            sleep 5
          done
          root="$(mktemp -d)"
          npm install --prefix "${root}" --no-save "@microck/canonfig@${RELEASE_VERSION}"
          actual="$("${root}/node_modules/.bin/canonfig" --version)"
          test "${actual}" = "${RELEASE_VERSION}"
