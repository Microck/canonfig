name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - package.json
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: canonfig-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(release): prepare v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Resolve release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const requested = process.env.REQUESTED_VERSION?.trim();
          const version = requested === undefined || requested.length === 0
            ? manifest.version
            : requested;
          if (version !== manifest.version) {
            throw new Error(`requested ${version}; package.json contains ${manifest.version}`);
          }
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`release version must be exact semver: ${version}`);
          }
          // CHANGELOG.md holds every release, newest first, under `## vX.Y.Z - YYYY-MM-DD`. The GitHub release
          // gets only this version's section, with its headings raised one level as it appeared before.
          const lines = readFileSync("CHANGELOG.md", "utf8").split("\n");
          const start = lines.findIndex((line) => line.startsWith(`## v${version} `) || line === `## v${version}`);
          if (start < 0) {
            throw new Error(`CHANGELOG.md has no "## v${version}" section`);
          }
          const end = lines.findIndex((line, index) => index > start && /^## /.test(line));
          let fence = false;
          const notes = lines.slice(start + 1, end < 0 ? undefined : end).map((line) => {
            if (line.startsWith("```")) fence = !fence;
            return !fence && /^#{3,6} /.test(line) ? line.slice(1) : line;
          }).join("\n").trim();
          if (notes.length === 0) {
            throw new Error(`CHANGELOG.md section v${version} is empty`);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, "release-notes.md"), `${notes}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Verify unpublished version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

          response="$(mktemp)"
          if ! registry_status="$(
            curl --silent --show-error --location \
              --output "${response}" \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/@microck%2fcanonfig/${RELEASE_VERSION}"
          )"; then
            echo "npm registry preflight failed" >&2
            exit 1
          fi

          case "${registry_status}" in
            404)
              ;;
            200)
              echo "@microck/canonfig@${RELEASE_VERSION} is already published" >&2
              exit 1
              ;;
            *)
              echo "npm registry preflight returned HTTP ${registry_status}" >&2
              cat "${response}" >&2
              exit 1
              ;;
          esac

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix ui

      - name: Validate release
        run: |
          npm run typecheck
          npm run lint
          npm run build:cli
          npm test
          npm run release:validate
          npm run build
          git diff --check

      - name: Publish package through npm trusted publishing
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Canonfig v${RELEASE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --fail-on-no-commits


  verify:
    name: Verify published package
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Wait for registry visibility and verify a fresh install
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: node tools/release/verify-published.mjs "$RELEASE_VERSION"
